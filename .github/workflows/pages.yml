name: Avalda leht

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Lisa userscript saidile
        run: cp userscript/kohalolek-tahvel.user.js site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Eraldi töö: samas töös ei leidnud deploy-pages äsja üles laaditud artefakti (26.11.2026).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
