<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>Kohalolek · õpetaja</title>
<style>
/* Paigutus: tunni vaates vasakul suur QR ja loendur (projektorile), paremal nimekiri (õpetajale). Kitsal ekraanil üksteise all. */
:root{--bg:#F2F4F1;--surface:#fff;--ink:#1C2827;--muted:#596765;--line:#D5DCD8;--accent:#2C6A5D;--accent-ink:#fff;--accent-soft:#DFEDE8;--warm:#A9690F;--warm-soft:#FAEDD5;--crit:#A63C27;--crit-soft:#F7DED7}
@media (prefers-color-scheme:dark){:root{--bg:#121817;--surface:#1A2221;--ink:#E4EBE8;--muted:#94A29F;--line:#2B3634;--accent:#6DB5A3;--accent-ink:#0E1615;--accent-soft:#1E3530;--warm:#E2AA4E;--warm-soft:#3A2E17;--crit:#E57F67;--crit-soft:#41231C}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:14px max(14px,env(safe-area-inset-right)) 60px max(14px,env(safe-area-inset-left))}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.narrow{max-width:560px}
h1{font-size:20px;margin:0}
h2{font-size:17px;margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.btn{font:inherit;font-size:14px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 13px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn[data-armed="1"]{background:var(--crit);border-color:var(--crit);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}
input[type=text],input[type=password],input[type=time],input[type=number],textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input[type=number]{width:64px}
textarea{width:100%;resize:vertical;line-height:1.4}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.f input,label.f select{font-size:16px}
label.chk{display:inline-flex;gap:6px;align-items:center;font-size:14px;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.banner{background:var(--warm-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.banner.crit{background:var(--crit-soft)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.tabs button{font:inherit;font-size:14px;border:0;background:transparent;color:var(--muted);padding:8px;border-radius:7px;cursor:pointer}
.tabs button[aria-current=true]{background:var(--accent);color:var(--accent-ink);font-weight:700}

.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.qrpane{align-items:center;text-align:center}
.qrpane:fullscreen{justify-content:center;border-radius:0;border:0;padding:3vh}
#qr{background:#fff;border-radius:10px;padding:8px;width:100%;max-width:min(640px,72vh)}
.qrpane:fullscreen #qr{max-width:min(92vw,78vh)}
#qr svg{display:block;width:100%;height:auto}
.count{font-size:44px;font-weight:700;line-height:1.1}
.qrpane:fullscreen .count{font-size:7vh}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:15px}

.list{display:flex;flex-direction:column}
.st{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:transparent;border-left:0;border-right:0;border-top:0;font:inherit;color:inherit;text-align:left;width:100%}
.st:last-child{border-bottom:0}
.chip{display:inline-flex;align-items:center;justify-content:center;width:34px;height:30px;border-radius:7px;font-weight:700;font-size:15px}
.chip.K{background:var(--accent-soft);color:var(--accent)}
.chip.H{background:var(--warm-soft);color:var(--warm)}
.chip.P{background:var(--crit-soft);color:var(--crit)}
.chip.W{border:1px dashed var(--line);color:var(--muted)}
.chip.O{background:var(--warm-soft);color:var(--crit);font-size:12px}
.strip{display:inline-flex;gap:2px;margin-right:8px;vertical-align:-2px}
.mini{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:4px;font-size:11px;font-weight:700}
.mini.K{background:var(--accent-soft);color:var(--accent)}.mini.H{background:var(--warm-soft);color:var(--warm)}.mini.P{background:var(--crit-soft);color:var(--crit)}
.st .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .d{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:1px 5px;margin-left:6px;background:var(--warm-soft);color:var(--warm);vertical-align:1px}
.tag.crit{background:var(--crit-soft);color:var(--crit)}
.acts{display:flex;flex-wrap:wrap;gap:6px;padding:8px 4px 12px;border-bottom:1px solid var(--line)}
.acts.cont{border-bottom:0;padding-bottom:6px}
.acts.per{align-items:center;padding-top:0;gap:6px 12px}
.lk{display:inline-flex;align-items:center;gap:3px}
.lnr{font-size:13px;color:var(--muted);min-width:20px;text-align:right;margin-right:2px}
.pb{font:inherit;font-size:14px;font-weight:700;width:36px;height:36px;padding:0;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:7px;cursor:pointer}
.pb.on.K{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.pb.on.H{background:var(--warm-soft);color:var(--warm);border-color:var(--warm)}
.pb.on.P{background:var(--crit-soft);color:var(--crit);border-color:var(--crit)}
.pb.man{box-shadow:inset 0 -4px 0 currentColor}
.pb:disabled{opacity:.5;cursor:default}
.grp{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.hidden-names .n{filter:blur(7px)}
/* telefonis märkmete vaates jääb tunni seadete plokk peitu, et tabel oleks kohe ees (seaded on vahekaardil Kohalolek) */
@media (max-width:860px){.mark .sets{display:none}}
.panes{display:inline-grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.panes button{font:inherit;font-size:14px;border:0;background:transparent;color:var(--muted);padding:7px 14px;border-radius:7px;cursor:pointer}
.panes button[aria-current=true]{background:var(--accent);color:var(--accent-ink);font-weight:700}
table.mx{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
.mx th{position:sticky;top:0;z-index:2;background:var(--surface);font-size:11.5px;font-weight:700;color:var(--muted);padding:8px 2px;border-bottom:1px solid var(--line);text-align:center;line-height:1.15;word-break:break-word}
.mx th:first-child{text-align:left;padding-left:6px}
.mx th.pk{color:var(--accent)}
.mx col.name{width:32%}
.mx td{border-bottom:1px solid var(--line);padding:3px 2px;text-align:center}
.mx tr:last-child td{border-bottom:0}
.mx td.n{text-align:left;padding-left:6px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell{width:100%;min-height:42px;border:1px dashed var(--line);border-radius:8px;background:transparent;color:var(--muted);font-size:16px;font-variant-numeric:tabular-nums;cursor:pointer;touch-action:manipulation}
.cell.c1{border:1px solid transparent;background:var(--warm-soft);color:var(--warm);font-weight:700}
.cell.c3{border:1px solid transparent;background:var(--crit-soft);color:var(--crit);font-weight:700}
.cell.k1{border:1px solid transparent;background:var(--accent-soft);color:var(--accent);font-weight:700}
.cell:active{transform:scale(.94)}
.txt{white-space:pre-wrap;word-break:break-word;font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:20;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 10px 10px 14px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast button{font:inherit;font-weight:700;font-size:14px;background:transparent;color:var(--bg);border:1px solid currentColor;border-radius:7px;padding:6px 10px;cursor:pointer;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden><span id="toastMsg"></span><button id="toastUndo">Võta tagasi</button></div>
<script src="../config.js"></script>
<script src="../lib/qrcode.js"></script>
<script src="../lib/common.js"></script>
<script>
(() => {
const { rpc, esc, hm, dmy, pad } = KOH;
const app = document.getElementById('app');
const LS = 'koh-auth';
const ROOT = new URL('../', location.href).href;
const LATE_MS = 15 * 60000;   // ÕKE p 9.8: alla 15 min = hilinemine, 15 min või rohkem = puudumine
const ROUND_GRACE_MS = 3 * 60000;
const LESSON_MS = 45 * 60000;
/* Tundide algusajad (allikas: kooli EduPage'i kellad, november 2026). */
const BELLS = {
  K: ['08:30', '09:15', '10:15', '11:00', '12:45', '13:30', '14:30', '15:15', '16:15', '17:00', '18:00', '18:45', '19:45', '20:30'],
  M: ['08:30', '09:15', '10:15', '11:00', '12:00', '12:45', '13:45', '14:30', '15:30', '16:15', '17:15', '18:00', '19:00', '19:45'],
};
const CAMPUS = { K: 'Kesklinn', M: 'Mustamäe' };
const ENTRY_TYPES = ['Tund', 'Praktiline töö', 'Iseseisev töö', 'E-õpe', 'Hindamine'];   // täpselt nagu Tahvli valikus
const CAPS = ['Auditoorne õpe', 'Iseseisev õpe', 'Praktiline töö'];
/* Märkuste (k: 'M') ja kiituste (k: 'K') tüübid. Tööruumi seadetes muudetavad; hoitakse serveris krüpteeritult. */
const DEFAULT_TYPES = [
  { id: 'tel', label: 'Telefon', text: 'kasutas tunnis telefoni ilma õpetaja loata', oke: '23.4.10', k: 'M' },
  { id: 'rag', label: 'Räägib', text: 'rääkis tunnis kõrvalistel teemadel ega keskendunud tööle', oke: '', k: 'M' },
  { id: 'seg', label: 'Segab', text: 'segas õppetöö läbiviimist ja kaasõpilaste tööd', oke: '23.4.1', k: 'M' },
  { id: 'mag', label: 'Magab', text: 'magas tunnis', oke: '23.4.20', k: 'M' },
  { id: 'kla', label: 'Klapid', text: 'kasutas tunnis kõrvaklappe ilma õpetaja loata', oke: '23.4.10', k: 'M' },
  { id: 'too', label: 'Ei tööta', text: 'ei teinud tunnis ettenähtud tööd', oke: '', k: 'M' },
  { id: 'tub', label: 'Tubli', text: 'töötas tunnis keskendunult ja tegi ettenähtud töö ära', oke: '', k: 'K' },
  { id: 'abi', label: 'Aitas', text: 'aitas kaasõpilasi', oke: '', k: 'K' },
];

let A = null;            // {code, auth, enc, teacher}
let G = [];              // rühmad koos lahti krüpteeritud nimekirjaga
let V = { view: 'login' };
let SS = null;           // käimasoleva/avatud tunni seis serverist
let offset = 0;          // serveri kell miinus selle seadme kell
let timers = [];
let lastQrKey = '';
let NT = { types: DEFAULT_TYPES.map(t => ({ ...t })), oke: true };   // tööruumi seaded
let RET = null;          // mitu päeva pärast tundi server tunni andmed kustutab (null = vanem server)
const noteCache = new Map();   // märke id → lahti krüpteeritud {s: koht, t: tüüp, at: aeg}
const ui = { tab: 'login', msg: '', openSlot: null, hide: false, net: true, frame: '', hold: null, pane: 'koh' };
try { ui.hide = localStorage.getItem('koh-hide') === '1'; } catch (e) {}

/* ---------- abid ---------- */
const now = () => Date.now() + offset;
const cred = () => ({ p_code: A.code, p_auth: A.auth });
const group = id => G.find(g => g.id === id) || null;
const hms = t => { const d = new Date(t); return hm(t) + ':' + pad(d.getSeconds()); };
function loadAuth() { try { return JSON.parse(sessionStorage.getItem(LS) || localStorage.getItem(LS) || 'null'); } catch (e) { return null; } }
function saveAuth(a, remember) {
  try {
    (remember ? localStorage : sessionStorage).setItem(LS, JSON.stringify(a));
    (remember ? sessionStorage : localStorage).removeItem(LS);
  } catch (e) {}
}
function stopTimers() { timers.forEach(clearInterval); timers = []; }
function armed(btn) {
  if (btn.dataset.armed === '1') return true;
  btn.dataset.orig = btn.textContent; btn.dataset.armed = '1'; btn.textContent = 'Kinnita';
  setTimeout(() => { if (btn.isConnected) { btn.dataset.armed = ''; btn.textContent = btn.dataset.orig; } }, 3500);
  return false;
}
function copyText(text, btn) {
  const fin = ok => { if (!btn) return; btn.dataset.orig = btn.dataset.orig || btn.textContent; btn.textContent = ok ? 'Kopeeritud' : 'Ei õnnestunud'; setTimeout(() => { if (btn.isConnected) btn.textContent = btn.dataset.orig; }, 1600); };
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove(); return ok; };
  try { navigator.clipboard.writeText(text).then(() => fin(true), () => fin(fallback())); } catch (e) { fin(fallback()); }
}
function qrSvg(text) { const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ scalable: true, margin: 2 }); }
function newSlot(used) { for (;;) { const s = Math.random().toString(36).slice(2, 6).padEnd(4, '0'); if (!used.has(s)) { used.add(s); return s; } } }
const guessCampus = label => /^\s*M/i.test(label) ? 'M' : 'K';
const campusOf = g => (g.roster.campus in BELLS ? g.roster.campus : guessCampus(g.label));
/* Rühma tunnikellad sessiooni kuupäeval (ms). */
function bellTimes(g, dayTs) {
  return BELLS[campusOf(g)].map(t => { const [h, m] = t.split(':').map(Number); const x = new Date(dayTs); x.setHours(h, m, 0, 0); return x.getTime(); });
}
/* Mitmes tund kell `ts` käib või kohe algab (kuni 10 min enne kella loetakse juba järgmiseks). */
function guessNr(g, ts) { let k = 0; bellTimes(g, ts).forEach((b, i) => { if (b <= ts + 10 * 60000) k = i; }); return k + 1; }
/* Algustunni ja tundide arvu eeltäitmine tunniplaanist (valikuline). Sama aadressi all olev tunniplaani leht
 * avaldab EduPage'ist loetud tunnid (plokid: päev, algus, lõpp, rühm, „7–8“). Kui selle rühma tund praegu käib
 * või algab kuni 15 min pärast, võetakse sealt algustund ja tundide arv. Kui andmeid pole, jääb vaikimisi pakkumine. */
const TT_URL = new URL('../../tunniplaan/data/snap.json', location.href).href;
async function timetableHint(g, ts) {
  try {
    const r = await fetch(TT_URL, { cache: 'no-cache' }); if (!r.ok) return null;
    const c = (await r.json())[campusOf(g) === 'M' ? 'mustamae' : 'kesklinn']; if (!c) return null;
    const iso = x => x.getFullYear() + '-' + pad(x.getMonth() + 1) + '-' + pad(x.getDate());
    const mondayOf = x => { const y = new Date(x); y.setHours(12, 0, 0, 0); y.setDate(y.getDate() - (y.getDay() + 6) % 7); return y; };
    // EduPage'i alguskuupäev võib olla vananenud; nädala tegelik vahemik on versiooni nimes (nagu tunniplaani lehel)
    const versionMonday = v => {
      const m = String(v.name || '').match(/(\d{2})\.(\d{2})-\d{2}\.\d{2}\.(\d{2})/);
      if (m) return iso(mondayOf(new Date(2000 + +m[3], +m[2] - 1, +m[1])));
      if (!v.from) return null;
      const d = new Date(v.from + 'T12:00:00'); if (d.getDay() === 0) d.setDate(d.getDate() + 1);
      return iso(mondayOf(d));
    };
    const d = new Date(ts), mon = iso(mondayOf(d)), day = (d.getDay() + 6) % 7, nowMin = d.getHours() * 60 + d.getMinutes();
    const tagged = (c.versions || []).filter(v => !v.hidden).map(v => ({ v, monday: versionMonday(v) })).filter(x => x.monday);
    let ver = tagged.filter(x => x.monday === mon).pop();
    if (!ver) {   // selle nädala versiooni pole: kasuta viimast varasemat ainult siis, kui hilisemat ei ole
      if (tagged.some(x => x.monday > mon)) return null;
      ver = tagged.filter(x => x.monday < mon).sort((a, b) => a.monday < b.monday ? -1 : 1).pop();
      if (!ver) return null;
    }
    const mins = t => { const [h, m] = String(t).split(':').map(Number); return h * 60 + m; };
    const mine = b => String(b.group || '').toUpperCase().split(/[\s,;/]+/).includes(g.label.trim().toUpperCase());
    const cur = (ver.v.blocks || []).find(b => b.day === day && mine(b) && mins(b.start) - 15 <= nowMin && nowMin < mins(b.end));
    if (!cur) return null;
    const m = String(cur.lessons || '').match(/^(\d+)(?:\D+(\d+))?$/);
    let p0, p1;
    if (m) { p0 = +m[1]; p1 = +(m[2] || m[1]); }
    else { const bl = ver.v.bells || []; p0 = bl.findIndex(x => x.start === cur.start) + 1; p1 = bl.findIndex(x => x.end === cur.end) + 1; }
    if (!(p0 >= 1 && p1 >= p0)) return null;
    return { nr: p0, n: p1 - p0 + 1, tt: `${cur.subject || 'tund'}, ${p0 === p1 ? p0 + '. tund' : 'tunnid ' + p0 + '–' + p1}` };
  } catch (e) { return null; }
}
const groupDefaults = gid => { try { return JSON.parse(localStorage.getItem('koh-def-' + gid) || '{}'); } catch (e) { return {}; } };
const cleanName = n => n.replace(/^\s*\d+[.)]\s*/, '').replace(/\s+/g, ' ').trim();

/* ---------- sisselogimine ja rühmad ---------- */
async function applyLogin(r) {
  offset = r.now - Date.now();
  NT = { types: DEFAULT_TYPES.map(t => ({ ...t })), oke: true };
  RET = Number.isInteger(r.retain_days) ? r.retain_days : null;
  if (r.settings_enc) { try { const o = await KOH.decrypt(A.enc, r.settings_enc); if (o && Array.isArray(o.types) && o.types.length) NT = { types: o.types, oke: o.oke !== false }; } catch (e) {} }
  const out = [];
  for (const g of r.groups) {
    let roster;
    try { roster = await KOH.decrypt(A.enc, g.roster_enc); } catch (e) { roster = { kg: null, students: [], broken: true }; }
    out.push({ ...g, roster });
  }
  G = out;
}
async function refresh() {
  const r = await rpc('koh_ws_login', cred());
  if (!r.ok) { logout(); return false; }
  await applyLogin(r); return true;
}
function logout() {
  stopTimers(); A = null; G = []; SS = null;
  try { localStorage.removeItem(LS); sessionStorage.removeItem(LS); } catch (e) {}
  V = { view: 'login' }; render();
}
async function saveGroup(existing, label, names, tids, campus) {
  const old = existing ? existing.roster.students : [];
  const used = new Set(old.map(s => s.slot));
  const seen = new Set();
  const students = [];
  for (const raw of names) {
    const name = cleanName(raw); if (!name || seen.has(name)) continue; seen.add(name);
    const ex = old.find(s => s.name === name);
    const tid = (tids && tids[name]) || (ex && ex.tid) || null;
    students.push(ex ? { ...ex, tid } : { slot: newSlot(used), name, tid });
  }
  const kg = (existing && existing.roster.kg) || KOH.randomKey(16);
  const r = await rpc('koh_group_save', {
    ...cred(), p_id: existing ? existing.id : null, p_label: label,
    p_roster_enc: await KOH.encrypt(A.enc, { kg, students, campus: campus || (existing && existing.roster.campus) || guessCampus(label) }),
    p_list_enc: await KOH.encrypt(kg, students.map(s => [s.slot, s.name]).sort((a, b) => a[1].localeCompare(b[1], 'et'))),
    p_slots: students.map(s => s.slot),
  });
  return r.ok;
}
/* Tahvli userscripti kopeeritud nimekiri või Tunnimärkmete impordifail. */
function parseImport(text) {
  let o; try { o = JSON.parse(text); } catch (e) { return null; }
  if (o && o.kind === 'nimekiri' && Array.isArray(o.students)) {
    return [{ label: String(o.group || o.journal || 'Rühm'), names: o.students.map(s => s.name), tids: Object.fromEntries(o.students.filter(s => s.tid).map(s => [cleanName(s.name), s.tid])) }];
  }
  if (o && Array.isArray(o.groups)) {
    return o.groups.filter(g => g && g.name).map(g => ({ label: String(g.name), names: (g.students || []).filter(x => typeof x === 'string'), tids: {} }));
  }
  return null;
}
async function importGroups(list) {
  let n = 0;
  for (const it of list) {

/* Tunni lisaandmed: algustund, tundide arv, Tahvli kande liik ja maht. Server hoiab, kohalik koopia on varuks. */
function metaOf() {
  const s = SS.session, g = group(s.group_id), d = groupDefaults(g.id);
  let local = {}; try { local = JSON.parse(localStorage.getItem('koh-meta-' + s.id) || '{}'); } catch (e) {}

    type: typeof m.type === 'string' ? m.type : (d.type || ''), cap: Array.isArray(m.cap) ? m.cap : (d.cap || []), tt: typeof m.tt === 'string' ? m.tt.slice(0, 120) : '' };

/* Iga tunni algusaeg: esimene = „Tund algas“, järgmised kooli kellade järgi. */
function lessonRefs(g, s, M) {
  const b = bellTimes(g, s.start_at), out = [s.start_at];

  for (let i = 1; i < out.length; i++) if (out[i] <= out[i - 1]) out[i] = out[i - 1] + LESSON_MS;
  return out;
}
/* Ühe õpilase staatus iga tunni kohta (puhas funktsioon, testitav).

 * rounds = hilisemad kontrollid [{n, at, closed}]. ÕKE p 9.8: alla 15 min hiljem = H, muidu P.
 * Kontrollis skaneerimata jäänu loetakse sellest tunnist alates puudujaks, kuni ta uuesti skaneerib. */
function calcPer(refs, on, scans, rounds) {
  if (!scans.length) return { per: refs.map(() => 'P'), missed: [] };
  const idxAt = ts => { let k = 0; refs.forEach((r, i) => { if (r <= ts) k = i; }); if (ts >= refs[k] + LESSON_MS && k < refs.length - 1) k++; return k; };

    const nx = scans.find(c => c.at > rd.at);

    cur.en = rd.at; missed.push(rd.n);

}

  document.getElementById('claims').innerHTML = SS.claims.map(cl => `<div class="banner row between"><span><strong>${esc(nameOf(cl.slot))}</strong>: uus telefon tahab selle nimega siduda (${hm(cl.at)}).</span><span class="row"><button class="btn primary" data-act="claim" data-device="${esc(cl.device)}" data-ok="1">Luba</button><button class="btn" data-act="claim" data-device="${esc(cl.device)}" data-ok="0">Keela</button></span></div>`).join('');

    if (ui.openSlot !== x.slot) return row;

    else if (a === 'claim') { await act('koh_claim_resolve', { p_session: V.id, p_device: b.dataset.device, p_approve: b.dataset.ok === '1' }); updateSession(); }
    else if (a === 'round') { if (!armed(b)) return; await act('koh_session_round', { p_session: V.id }); lastQrKey = ''; render(); updateQr(); }
    else if (a === 'end') { if (!armed(b)) return; await act('koh_session_end', { p_session: V.id, p_end: true }); if (document.fullscreenElement) document.exitFullscreen(); render(); }
    else if (a === 'reopen') { await act('koh_session_end', { p_session: V.id, p_end: false }); lastQrKey = ''; render(); updateQr(); }
    else if (a === 'delete-session') { if (!armed(b)) return; await rpc('koh_session_delete', { ...cred(), p_session: V.id }); await goHome(); }
    else if (a === 'copy-tahvel') copyText(exportTahvel(), b);
    else if (a === 'copy-text') copyText(exportText(), b);
    else if (a === 'fullscreen') { const p = document.getElementById('qrpane'); if (document.fullscreenElement) document.exitFullscreen(); else if (p.requestFullscreen) p.requestFullscreen(); }
  } catch (e) { ui.net = false; if (V.view === 'session') updateSession(); else { ui.msg = 'Ühendus serveriga ei õnnestunud.'; render(); } }
});
document.addEventListener('change', async ev => {
  const t = ev.target;
  try {
    if (t.id === 'hideNames') { ui.hide = t.checked; try { localStorage.setItem('koh-hide', ui.hide ? '1' : '0'); } catch (e) {} updateSession(); }
    else if (t.id === 'startAt' && SS && t.value) {
      const d = new Date(SS.session.start_at), [h, m] = t.value.split(':').map(Number); d.setHours(h, m, 0, 0);
      await act('koh_session_update', { p_session: V.id, p_start_at: d.toISOString(), p_ontime: null }); updateSession();
    }
    else if (t.id === 'ontime' && SS) {
      const n = Math.min(60, Math.max(0, +t.value || 0)); try { localStorage.setItem('koh-ontime', String(n)); } catch (e) {}
      await act('koh_session_update', { p_session: V.id, p_start_at: null, p_ontime: n }); updateSession();
    }
    else if (t.id === 'mNr' && SS) {
      const nr = +t.value, bell = bellTimes(group(SS.session.group_id), SS.session.start_at)[nr - 1];
      await saveMeta({ nr, tt: '' });
      await act('koh_session_update', { p_session: V.id, p_start_at: new Date(bell).toISOString(), p_ontime: null });
      const sa = document.getElementById('startAt'); if (sa) sa.value = hm(bell);
      updateSession();
    }
    else if (t.id === 'mN' && SS) { await saveMeta({ n: Math.min(12, Math.max(1, +t.value || 1)), tt: '' }); updateSession(); }
    else if (t.id === 'mType' && SS) { await saveMeta({ type: t.value }); }
    else if (t.dataset && t.dataset.cap && SS) { await saveMeta({ cap: [...document.querySelectorAll('input[data-cap]:checked')].map(x => x.dataset.cap) }); }
    else if (t.id === 'retDays') {
      const r = await rpc('koh_ws_retention', { ...cred(), p_days: +t.value });
      if (r.ok) { RET = r.retain_days; ui.msg = `Tunnid kustutatakse nüüd ${RET} päeva pärast tundi.`; } else ui.msg = 'Tähtaega ei saanud salvestada.';
      render();
    }
    else if (t.id === 'impFile') {
      const f = t.files && t.files[0]; if (!f) return;
      const list = parseImport(await f.text());
      if (!list) { ui.msg = 'See ei ole impordifail.'; render(); return; }
      const n = await importGroups(list); ui.msg = `Imporditud ${n} rühma.`; render();
    }
  } catch (e) { ui.msg = 'Ühendus serveriga ei õnnestunud.'; if (V.view !== 'session') render(); }
});
/* Tahvlist kopeeritud nimekirja kleepimine rühma vormi täidab nime ja õpilased korraga. */
document.addEventListener('paste', ev => {
  if (ev.target.id !== 'gNames') return;
  const list = parseImport((ev.clipboardData || window.clipboardData).getData('text'));
  if (!list || list.length !== 1) return;
  ev.preventDefault();
  const it = list[0], lab = document.getElementById('gLabel');
  if (!lab.value.trim()) { lab.value = it.label.slice(0, 60); if (!V.id) document.getElementById('gCampus').value = guessCampus(it.label); }
  ev.target.value = it.names.map(cleanName).join('\n'); V.tids = it.tids;
});

/* ---------- käivitus ---------- */
(async () => {
  A = loadAuth();
  if (!A) { render(); return; }
  app.innerHTML = '<div class="card"><p class="muted" style="margin:0">Laen…</p></div>';
  try { if (await refresh()) { V = { view: 'home' }; render(); } } catch (e) { ui.msg = 'Ühendus serveriga ei õnnestunud.'; V = { view: 'login' }; render(); }
})();
})();
